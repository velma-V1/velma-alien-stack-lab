name: Experiment 009 Solver Kill Test

on:
  pull_request:
    branches:
      - experiment/008-architecture-discovery
    paths:
      - 'alien_lab/solver_kill_test.py'
      - 'tests/test_solver_kill_test.py'
      - 'experiments/009-solver-kill-test/**'
      - '.github/workflows/009-smoke.yml'
  workflow_dispatch:

jobs:
  solver-kill-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 009 unit tests
        run: python -m unittest tests.test_solver_kill_test -v
