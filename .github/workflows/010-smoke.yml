name: Experiment 010 Computational Basis Atlas

on:
  pull_request:
    branches:
      - experiment/009-solver-kill-test
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'alien_lab/computational_atlas*.py'
      - 'tests/test_computational_atlas*.py'
      - 'experiments/010-computational-basis-atlas/**'
      - 'docs/superpowers/specs/2026-08-29-experiment-010-computational-basis-atlas-design.md'
      - 'docs/superpowers/plans/2026-08-29-experiment-010-computational-basis-atlas.md'
      - 'docs/superpowers/plans/2026-08-29-experiment-010-c-i-live-phases.md'
      - '.github/workflows/010-smoke.yml'
  workflow_dispatch:

jobs:
  computational-basis-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 010 test dependencies
        run: python -m pip install 'Pillow==11.3.0'
      - name: Compile Python sources
        run: python -m compileall alien_lab tests
      - name: Run 010 and prior regression tests
        run: |
          python -m unittest \
            tests.test_computational_atlas \
            tests.test_computational_atlas_claims \
            tests.test_computational_atlas_live \
            tests.test_computational_atlas_live_harness \
            tests.test_computational_atlas_live_cd_preflight \
            tests.test_computational_atlas_live_config_preflight \
            tests.test_computational_atlas_live_scientific_self_attack \
            tests.test_solver_kill_test \
            tests.test_architecture_discovery \
            -v
      - name: Run credential-free 010 smoke atlas
        run: |
          rm -rf /tmp/010-computational-basis-atlas-smoke
          python -m alien_lab.computational_atlas \
            --config experiments/010-computational-basis-atlas/config.json \
            --output-dir /tmp/010-computational-basis-atlas-smoke \
            --profile smoke
          cat /tmp/010-computational-basis-atlas-smoke/summary.json
      - name: Run full 18,112-cell deterministic atlas
        run: |
          rm -rf /tmp/010-computational-basis-atlas-full
          python -m alien_lab.computational_atlas \
            --config experiments/010-computational-basis-atlas/config.json \
            --output-dir /tmp/010-computational-basis-atlas-full \
            --profile atlas
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/010-computational-basis-atlas-full/summary.json').read_text())
          compact = {key: summary[key] for key in (
              'conclusion', 'expected_cells', 'terminal_cells', 'invalid_cells',
              'verified_successes', 'valid_unresolved', 'model_calls',
              'ledger_hash', 'replay_fingerprint'
          )}
          print(json.dumps(compact, indent=2, sort_keys=True))
          PY
      - name: Upload 010 report evidence
        uses: actions/upload-artifact@v4
        with:
          name: experiment-010-report-evidence
          path: |
            /tmp/010-computational-basis-atlas-smoke/summary.json
            /tmp/010-computational-basis-atlas-full/summary.json
            /tmp/010-computational-basis-atlas-full/discovery-report.json
            /tmp/010-computational-basis-atlas-full/production-fitness.json
          if-no-files-found: error
          retention-days: 30
